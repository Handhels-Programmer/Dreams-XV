<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Dream XV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap');
        
        .font-title { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Montserrat', sans-serif; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#FCF9F8] text-[#2A1E1D] font-sans min-h-screen flex flex-col relative">

    <header class="flex justify-between items-start md:items-center p-6 md:px-16 w-full relative z-30">
        <a href="index.html" class="flex items-center gap-2 text-xs md:text-sm tracking-widest uppercase hover:text-[#44a0cf] transition-colors w-24">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path></svg>
            Volver
        </a>

        <div class="text-center flex-1 mt-2 md:mt-0">
            <h1 class="text-3xl md:text-5xl font-title mb-2">Videos</h1>
            <p class="text-[10px] md:text-xs tracking-[0.15em] uppercase font-light opacity-70">La película de este gran día</p>
        </div>

        <div class="flex items-center gap-4 w-24 justify-end">
            <button class="hidden md:flex items-center gap-2 text-xs tracking-widest uppercase hover:text-[#44a0cf] transition-colors">
                <svg class="w-4 h-4 text-[#44a0cf]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                Música
            </button>
            <div id="btnMenu" class="cursor-pointer text-[#44a0cf] hover:text-[#D6687C] transition-colors z-40">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </div>
        </div>
    </header>

    <div id="menuMovil" class="fixed inset-0 bg-[#44a0cf]/95 backdrop-blur-md z-20 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <nav class="flex flex-col gap-8 text-sm tracking-[0.2em] uppercase text-center">
            <a href="index.html" class="hover:text-[#44a0cf] transition-colors">Inicio</a>
            <a href="galeria.html" class="hover:text-[#44a0cf] transition-colors">Galería</a>
            <a href="videos.html" class="text-[#2724e0]">Videos</a>
            <a href="historia.html" class="hover:text-[#44a0cf] transition-colors">Historia</a>
            <a href="mensajes.html" class="hover:text-[#44a0cf] transition-colors">Mensaje</a>
        </nav>
    </div>

    <main class="w-full px-6 md:px-16 pb-16 flex-1 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
            
            <div class="video-card relative group overflow-hidden rounded-xl aspect-video cursor-pointer shadow-sm hover:shadow-lg transition-all" data-video-url="IMG/Fotografo/Fotografo.mp4">
                <img src="IMG/Fotografo/Lorena I-07.jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/30 group-hover:bg-black/50 transition-colors duration-300 flex items-center justify-center">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/40 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    </div>
                </div>
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-4 flex justify-between items-end">
                    <div>
                        <span class="text-white text-sm md:text-base font-medium tracking-wide">Fotografo</span>
                        <p class="text-white/70 text-[10px] tracking-widest uppercase mt-1">Resumen</p>
                    </div>
                    <span class="text-white/90 text-xs font-mono bg-black/40 px-2 py-1 rounded">05:36</span>
                </div>
            </div>

            <div class="video-card relative group overflow-hidden rounded-xl aspect-video cursor-pointer shadow-sm hover:shadow-lg transition-all" data-video-url="IMG/Handhels/Handhels.mp4">
                <img src="IMG/Handhels/IMG_20250510_001 (10).jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/30 group-hover:bg-black/50 transition-colors duration-300 flex items-center justify-center">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/40 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    </div>
                </div>
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-4 flex justify-between items-end">
                    <div>
                        <span class="text-white text-sm md:text-base font-medium tracking-wide">Handhels</span>
                        <p class="text-white/70 text-[10px] tracking-widest uppercase mt-1">Resumen</p>
                    </div>
                    <span class="text-white/90 text-xs font-mono bg-black/40 px-2 py-1 rounded">00:52</span>
                </div>
            </div>

            <div class="video-card relative group overflow-hidden rounded-xl aspect-video cursor-pointer shadow-sm hover:shadow-lg transition-all" data-video-url="IMG/Lorainne 1/Lorainne 1.mp4">
                <img src="IMG/Lorainne 1/IMG_20250511 (82).jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/30 group-hover:bg-black/50 transition-colors duration-300 flex items-center justify-center">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/40 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    </div>
                </div>
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-4 flex justify-between items-end">
                    <div>
                        <span class="text-white text-sm md:text-base font-medium tracking-wide">Loraine 1</span>
                        <p class="text-white/70 text-[10px] tracking-widest uppercase mt-1">Resumen</p>
                    </div>
                    <span class="text-white/90 text-xs font-mono bg-black/40 px-2 py-1 rounded">05:52</span>
                </div>
            </div>

            <div class="video-card relative group overflow-hidden rounded-xl aspect-video cursor-pointer shadow-sm hover:shadow-lg transition-all" data-video-url="IMG/Lorainne 2/Lorainne 2.mp4">
                <img src="IMG/Lorainne 2/IMG-20250510 (16).jpg" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/30 group-hover:bg-black/50 transition-colors duration-300 flex items-center justify-center">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center border border-white/40 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    </div>
                </div>
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-4 flex justify-between items-end">
                    <div>
                        <span class="text-white text-sm md:text-base font-medium tracking-wide">Loraine 2</span>
                        <p class="text-white/70 text-[10px] tracking-widest uppercase mt-1">Resumen</p>
                    </div>
                    <span class="text-white/90 text-xs font-mono bg-black/40 px-2 py-1 rounded">01:28</span>
                </div>
            </div>

        </div>
    </main>

    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        
        <button id="closeModal" class="absolute top-6 right-6 text-white/70 hover:text-white p-2 transition-colors z-50">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <div class="w-full max-w-5xl px-4 md:px-8 aspect-video relative">
            <iframe id="videoIframe" class="w-full h-full rounded-lg shadow-2xl" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <div class="md:hidden fixed bottom-6 right-6 z-10">
        <button class="bg-[#44a0cf] text-white p-4 rounded-full shadow-lg shadow-[#44a0cf]/40">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
        </button>
    </div>

    <script src="movil.js"></script>
    
    <script src="videos.js"></script>
</body>
</html>
