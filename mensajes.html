<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - Dream XV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap');
        
        .font-title { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Montserrat', sans-serif; }
        
        /* Ocultar scrollbar pero permitir scroll en la lista de mensajes */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#FCF9F8] text-[#2A1E1D] font-sans min-h-screen flex flex-col relative overflow-x-hidden">

    <header class="flex justify-between items-start md:items-center p-6 md:px-16 w-full relative z-30">
        
        <a href="index.html" class="flex items-center gap-2 text-xs md:text-sm tracking-widest uppercase hover:text-[#44a0cf] transition-colors w-24">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path></svg>
            Volver
        </a>

        <div class="text-center flex-1 mt-2 md:mt-0">
            <h1 class="text-3xl md:text-5xl font-title mb-2">Mensajes</h1>
            <p class="text-[10px] md:text-xs tracking-[0.15em] uppercase font-light opacity-70">Libro de firmas digital</p>
        </div>

        <div class="flex items-center gap-4 w-24 justify-end">
            <button class="hidden md:flex items-center gap-2 text-xs tracking-widest uppercase hover:text-[#44a0cf] transition-colors">
                <svg class="w-4 h-4 text-[#44a0cf]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                Música
            </button>
            <div id="btnMenu" class="cursor-pointer text-[#44a0cf] hover:text-[#D6687C] transition-colors z-40">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </div>
        </div>
    </header>

    <div id="menuMovil" class="fixed inset-0 bg-[#44a0cf]/95 backdrop-blur-md z-20 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <nav class="flex flex-col gap-8 text-sm tracking-[0.2em] uppercase text-center">
            <a href="index.html" class="hover:text-[#44a0cf] transition-colors">Inicio</a>
            <a href="galeria.html" class="hover:text-[#44a0cf] transition-colors">Galería</a>
            <a href="videos.html" class="hover:text-[#44a0cf] transition-colors">Videos</a>
            <a href="historia.html" class="hover:text-[#44a0cf] transition-colors">Historia</a>
            <a href="mensajes.html" class="text-[#2724e0]">Mensaje</a>
        </nav>
    </div>

    <main class="w-full px-6 md:px-16 pb-20 flex-1 relative z-10 max-w-7xl mx-auto flex flex-col lg:flex-row gap-12 mt-8 md:mt-12 h-full">
        
        <section class="w-full lg:w-5/12 flex flex-col">
            <div class="bg-white p-8 md:p-10 rounded-2xl shadow-sm border border-[#2A1E1D]/5 sticky top-8">
                <h2 class="text-2xl font-title mb-2 text-[#44a0cf]">Déjale un deseo</h2>
                <p class="text-xs md:text-sm font-light opacity-70 mb-8 leading-relaxed">
                    A Lorena le encantará leer tus palabras. Escribe un lindo recuerdo, un consejo o tus mejores deseos para esta nueva etapa.
                </p>

                <form id="formMensaje" class="flex flex-col gap-6">
                    <div class="flex flex-col gap-2">
                        <label for="nombre" class="text-[10px] tracking-widest uppercase font-medium opacity-80">Tu Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej. Tía Carmen y Familia" class="w-full bg-transparent border-b border-[#2A1E1D]/20 py-2 text-sm focus:outline-none focus:border-[#44a0cf] transition-colors" required>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="mensaje" class="text-[10px] tracking-widest uppercase font-medium opacity-80">Tu Mensaje</label>
                        <textarea id="mensaje" rows="4" placeholder="Escribe aquí tus mejores deseos..." class="w-full bg-transparent border-b border-[#2A1E1D]/20 py-2 text-sm focus:outline-none focus:border-[#44a0cf] transition-colors resize-none" required></textarea>
                    </div>

                    <button type="submit" class="mt-4 bg-[#44a0cf] hover:bg-[#D6687C] text-white px-8 py-3 rounded-md text-xs tracking-widest uppercase transition-all shadow-md flex items-center justify-center gap-2 font-medium w-full md:w-auto self-start">
                        Enviar Mensaje
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </form>
            </div>
        </section>

        <section class="w-full lg:w-7/12 flex flex-col">
            <h3 class="text-sm tracking-[0.2em] uppercase font-light opacity-70 mb-6 hidden lg:block">Mensajes Recientes</h3>
            
            <div id="listaMensajes" class="flex flex-col gap-4 lg:max-h-[600px] lg:overflow-y-auto no-scrollbar lg:pr-4">

            </div>
        </section>

    </main>

    <div class="md:hidden fixed bottom-6 right-6 z-10">
        <button class="bg-[#44a0cf] text-white p-4 rounded-full shadow-lg shadow-[#44a0cf]/40">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
        </button>
    </div>

    <script src="movil.js"></script>

    <script type="module">
        // 1. Importamos la conexión a tu base de datos
        import { db } from "./firebaseConfig.js";
        
        // 2. Importamos las herramientas de Firestore
        import { collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Referencias al HTML
        const formMensaje = document.getElementById('formMensaje');
        const listaMensajes = document.getElementById('listaMensajes');

        // LEER MENSAJES EN TIEMPO REAL
        const q = query(collection(db, "mensajes"), orderBy("fecha", "desc"));
        
        onSnapshot(q, (snapshot) => {
            listaMensajes.innerHTML = ''; 

            snapshot.forEach((doc) => {
                const data = doc.data();
                
                let fechaTexto = "Justo ahora";
                if (data.fecha) {
                    const opciones = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
                    fechaTexto = new Date(data.fecha.toDate()).toLocaleDateString('es-ES', opciones);
                }

                const mensajeHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-[#44a0cf] animate-fade-in">
                        <div class="flex justify-between items-start mb-3">
                            <span class="font-medium text-sm md:text-base">${data.nombre}</span>
                            <span class="text-[10px] text-gray-400">${fechaTexto}</span>
                        </div>
                        <p class="text-sm font-light leading-relaxed opacity-80 italic">
                            "${data.mensaje}"
                        </p>
                    </div>
                `;
                listaMensajes.insertAdjacentHTML('beforeend', mensajeHTML);
            });
        });

        // ENVIAR UN NUEVO MENSAJE
        formMensaje.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const btnSubmit = formMensaje.querySelector('button[type="submit"]');
            const textoOriginalBoton = btnSubmit.innerHTML;
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = "Enviando...";

            const nombre = document.getElementById('nombre').value;
            const mensaje = document.getElementById('mensaje').value;

            try {
                await addDoc(collection(db, "mensajes"), {
                    nombre: nombre,
                    mensaje: mensaje,
                    fecha: serverTimestamp() 
                });
                formMensaje.reset();
            } catch (error) {
                console.error("Error al guardar el mensaje: ", error);
                alert("Hubo un error al enviar tu mensaje. Intenta de nuevo.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = textoOriginalBoton;
            }
        });
    </script>
</body>
</html>
